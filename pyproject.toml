[tool.poetry]
name = "route-listener"
version = "0.1.0"
description = "Listens for IPv6 Router Advertisements and configures ULA routes on the host. A workaround for Synology DSM (and other Linux distros) missing CONFIG_IPV6_ROUTE_INFO, enabling Home Assistant to reach Matter/Thread devices."
authors = ["Antony Stubbs <antony.stubbs@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/astubbs/ipv6-route-listener"
repository = "https://github.com/astubbs/ipv6-route-listener"
keywords = ["ipv6", "router-advertisement", "thread", "matter", "synology", "home-assistant", "icmpv6", "ula"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
    "Topic :: Home Automation",
]
packages = [{include = "route_listener"}]

[tool.poetry.dependencies]
python = "^3.11"
scapy = "^2.5.0"
netifaces = "^0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.12.0"
ruff = "^0.2.1"
mypy = "^1.8.0"
radon = "^6.0.1"
pylint = "^3.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
route-listen = "route_listener.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.radon]
min = "C"
exclude = "tests,venv,.venv,__pycache__"

[tool.pylint.messages_control]
disable = ["C0111", "C0103", "C0303", "W0511", "R0903", "R0913", "R0914"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_,pk,id"]
