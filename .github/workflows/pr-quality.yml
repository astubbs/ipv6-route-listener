name: PR Quality

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Block-level duplicate code detection (PMD CPD + jscpd) with base-vs-PR
  # comparison. Posts a single PR comment with delta vs base branch and fails
  # the build if duplication exceeds threshold or increases vs base.
  duplicate-detection:
    name: "Duplicate Code Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-cross-check@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          directories: 'route_listener tests'
          file-extensions: 'py'
          cpd-language: 'python'
          jscpd-file-pattern: '**/*.py'
          # Defaults: cpd-max-duplication 5%, jscpd-max-duplication 4%,
          # plus regression gating (cpd-max-increase / jscpd-max-increase 0.1%).
          # If first run flags spurious duplication on this small codebase,
          # raise the thresholds rather than refactoring just to satisfy them.

  # Whole-file similarity scoring (gensim TF-IDF). Complementary to the
  # block-level CPD/jscpd detector above - catches files that should be
  # merged or refactored at an architectural level.
  file-similarity:
    name: "File Similarity Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-detection-tool@feat/base-vs-pr-comparison
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directories: 'route_listener,tests'
          file_extensions: 'py'
          ignore_below: 30
          fail_above: 80
          warn_above: 50
          one_comment: true
          compare_with_base: true
          max_increase: 10

  # GitHub's dependency vulnerability scanner. Language-agnostic.
  dependency-scan:
    name: "Dependency Vulnerabilities"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
